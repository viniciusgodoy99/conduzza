<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}.sw>div{flex:1;height:66px;display:flex;align-items:flex-end;padding:7px 8px;font-size:9.5px;font-weight:600;font-family:var(--font-mono)}.grid{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--text-muted);margin-bottom:8px}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint)}</style></head><body><div class="lbl">Paper</div><div class="sw" style="box-shadow:inset 0 0 0 1px var(--border-hairline)"><div style="background:var(--cz-paper-050);color:#051813">050</div><div style="background:var(--cz-paper-100);color:#051813">100</div><div style="background:var(--cz-paper-200);color:#051813">200</div><div style="background:var(--cz-paper-300);color:#051813">300</div></div>
<div class="mono" style="margin-top:8px">--canvas = paper-100 · --surface = #ffffff · --surface-sunken = paper-200</div></body></html>
