<!-- @dsCard group="Colors" viewport="700x170" name="Semantic states" subtitle="Deliberately desaturated so lime stays the only loud colour on screen" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}.sw>div{flex:1;height:66px;display:flex;align-items:flex-end;padding:7px 8px;font-size:9.5px;font-weight:600;font-family:var(--font-mono)}.grid{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--text-muted);margin-bottom:8px}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)"><div style="height:38px;background:var(--cz-success-500)"></div><div style="height:26px;background:var(--cz-success-050)"></div><div style="padding:7px 9px;background:var(--surface)"><div style="font-size:11.5px;font-weight:700;color:var(--cz-success-700)">Confirmado</div><div class="mono">--cz-success-500</div></div></div><div style="border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)"><div style="height:38px;background:var(--cz-warning-500)"></div><div style="height:26px;background:var(--cz-warning-050)"></div><div style="padding:7px 9px;background:var(--surface)"><div style="font-size:11.5px;font-weight:700;color:var(--cz-warning-700)">Aguardando</div><div class="mono">--cz-warning-500</div></div></div><div style="border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)"><div style="height:38px;background:var(--cz-danger-500)"></div><div style="height:26px;background:var(--cz-danger-050)"></div><div style="padding:7px 9px;background:var(--surface)"><div style="font-size:11.5px;font-weight:700;color:var(--cz-danger-700)">Cancelado</div><div class="mono">--cz-danger-500</div></div></div><div style="border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)"><div style="height:38px;background:var(--cz-info-500)"></div><div style="height:26px;background:var(--cz-info-050)"></div><div style="padding:7px 9px;background:var(--surface)"><div style="font-size:11.5px;font-weight:700;color:var(--cz-info-700)">Remarcado</div><div class="mono">--cz-info-500</div></div></div>
</div></body></html>
