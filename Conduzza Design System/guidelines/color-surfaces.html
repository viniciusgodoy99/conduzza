<!-- @dsCard group="Colors" viewport="700x180" name="Surface & text aliases" subtitle="The semantic names components must use instead of raw ramp steps" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}.sw>div{flex:1;height:66px;display:flex;align-items:flex-end;padding:7px 8px;font-size:9.5px;font-weight:600;font-family:var(--font-mono)}.grid{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--text-muted);margin-bottom:8px}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div style="background:var(--surface);border:1px solid var(--border-hairline);border-radius:var(--radius-card);padding:14px;box-shadow:var(--shadow-sm)">
<div style="font-size:14px;font-weight:700;color:var(--text-strong)">text-strong — títulos e números</div>
<div style="font-size:13px;color:var(--text-body);margin-top:3px">text-body — corpo de texto padrão</div>
<div style="font-size:12.5px;color:var(--text-muted);margin-top:3px">text-muted — apoio, legendas, colunas</div>
<div style="font-size:12.5px;color:var(--text-faint);margin-top:3px">text-faint — carimbos de hora, metadados</div>
<div style="font-size:12.5px;color:var(--text-accent);margin-top:3px;font-weight:600">text-accent — link e ênfase lime</div>
</div>
<div class="cz-dark" style="background:var(--cz-ink-900);border-radius:var(--radius-card);padding:14px">
<div style="font-size:14px;font-weight:700;color:var(--text-strong)">.cz-dark — o mesmo alias, invertido</div>
<div style="font-size:13px;color:var(--text-body);margin-top:3px">text-body sobre ink-900</div>
<div style="font-size:12.5px;color:var(--text-muted);margin-top:3px">text-muted sobre ink-900</div>
<div style="font-size:12.5px;color:var(--text-accent);margin-top:3px;font-weight:600">text-accent vira lime-400</div>
</div>
</div></body></html>
