<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.p{border-radius:var(--radius-card);padding:16px;height:150px;display:flex;flex-direction:column;justify-content:space-between}.mono{font-family:var(--font-mono);font-size:9.5px}</style></head><body>
<div class="g">
<div class="p" style="background:var(--cz-paper-100);box-shadow:inset 0 0 0 1px var(--border-hairline)">
  <div><div class="cz-eyebrow">Produto</div><div style="font-size:17px;font-weight:700;color:var(--cz-ink-900);margin-top:4px;letter-spacing:-0.015em">Paper sobre branco</div><div style="font-size:12px;color:var(--cz-ink-500);margin-top:3px">Toda a interface interna. Cards brancos sobre canvas paper-100.</div></div>
  <div style="display:flex;gap:6px"><span style="height:26px;padding:0 11px;border-radius:10px;background:var(--cz-lime-400);color:var(--cz-ink-900);font-size:12px;font-weight:600;display:inline-flex;align-items:center">Ação</span><span style="height:26px;padding:0 11px;border-radius:10px;background:#fff;border:1px solid var(--border-subtle);font-size:12px;font-weight:600;color:var(--cz-ink-900);display:inline-flex;align-items:center">Secundária</span></div>
</div>
<div class="p cz-dark" style="background:var(--cz-ink-900)">
  <div><div class="cz-eyebrow" style="color:rgba(251,252,232,.4)">Chrome &amp; marketing</div><div style="font-size:17px;font-weight:700;color:var(--cz-cream-050);margin-top:4px;letter-spacing:-0.015em">Ink com lime</div><div style="font-size:12px;color:rgba(251,252,232,.6);margin-top:3px">Sidebar, toasts, telas de login, hero.</div></div>
  <div style="display:flex;gap:6px"><span style="height:26px;padding:0 11px;border-radius:10px;background:var(--cz-lime-400);color:var(--cz-ink-900);font-size:12px;font-weight:600;display:inline-flex;align-items:center">Ação</span><span style="height:26px;padding:0 11px;border-radius:10px;background:rgba(251,252,232,.08);color:var(--cz-cream-050);font-size:12px;font-weight:600;display:inline-flex;align-items:center">Secundária</span></div>
</div>
<div class="p" style="background:var(--cz-lime-400)">
  <div><div class="cz-eyebrow" style="color:rgba(5,24,19,.55)">Momento único</div><div style="font-size:17px;font-weight:700;color:var(--cz-ink-900);margin-top:4px;letter-spacing:-0.015em">Lime cheio</div><div style="font-size:12px;color:rgba(5,24,19,.68);margin-top:3px">Um bloco por tela, no máximo — KPI de destaque ou CTA.</div></div>
  <div class="mono" style="color:rgba(5,24,19,.55)">ink sobre lime · 8.9:1</div>
</div>
</div>
</body></html>
