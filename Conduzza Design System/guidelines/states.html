<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans);color:var(--text-strong)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--text-muted)}.row{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid var(--border-hairline)}.row:last-child{border:none}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center">
<div><div style="height:38px;border-radius:var(--radius-control);background:var(--cz-lime-400);transform:none;opacity:1;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--cz-ink-900)">Enviar</div><div class="mono" style="margin-top:7px">Padrão</div></div><div><div style="height:38px;border-radius:var(--radius-control);background:var(--cz-lime-500);transform:none;opacity:1;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--cz-ink-900)">Enviar</div><div class="mono" style="margin-top:7px">Hover</div></div><div><div style="height:38px;border-radius:var(--radius-control);background:var(--cz-lime-500);transform:scale(.975);opacity:1;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--cz-ink-900)">Enviar</div><div class="mono" style="margin-top:7px">Press</div></div><div><div style="height:38px;border-radius:var(--radius-control);background:var(--cz-lime-400);transform:none;opacity:.45;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--cz-ink-900)">Enviar</div><div class="mono" style="margin-top:7px">Disabled</div></div>
</div>
<div style="margin-top:12px;display:flex;gap:14px;align-items:center"><span style="height:36px;padding:0 14px;border-radius:var(--radius-control);background:var(--surface);border:1px solid var(--cz-lime-500);box-shadow:var(--focus-ring);display:inline-flex;align-items:center;font-size:13px">Foco de teclado</span><span class="mono">--focus-ring · 3px rgba(178,229,79,.55)</span></div></body></html>
