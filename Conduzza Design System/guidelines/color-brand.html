<!-- @dsCard group="Colors" viewport="700x150" name="Brand primitives" subtitle="The three colours sampled directly from the supplied logo files" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}.sw>div{flex:1;height:66px;display:flex;align-items:flex-end;padding:7px 8px;font-size:9.5px;font-weight:600;font-family:var(--font-mono)}.grid{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--text-muted);margin-bottom:8px}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div style="border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)"><div style="height:60px;background:var(--cz-lime-500)"></div><div style="padding:8px 10px;background:var(--surface)"><div style="font-size:12px;font-weight:700;color:var(--text-strong)">Lime</div><div class="mono">--cz-lime-500 · #b2e54f</div></div></div>
<div style="border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)"><div style="height:60px;background:var(--cz-ink-900)"></div><div style="padding:8px 10px;background:var(--surface)"><div style="font-size:12px;font-weight:700;color:var(--text-strong)">Ink</div><div class="mono">--cz-ink-900 · #051813</div></div></div>
<div style="border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)"><div style="height:60px;background:var(--cz-cream-050);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><div style="padding:8px 10px;background:var(--surface)"><div style="font-size:12px;font-weight:700;color:var(--text-strong)">Cream</div><div class="mono">--cz-cream-050 · #fbfce8</div></div></div>
</div></body></html>
