<!-- @dsCard group="Spacing" viewport="700x160" name="Motion" subtitle="Short and confident — nothing bounces, nothing overshoots" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans);color:var(--text-strong)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--text-muted)}.row{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid var(--border-hairline)}.row:last-child{border:none}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="background:var(--surface);border-radius:var(--radius-md);padding:12px;box-shadow:var(--shadow-xs)"><div class="cz-num" style="font-size:20px;font-weight:600">90ms</div><div class="mono" style="margin-top:2px">--dur-instant</div><div style="font-size:11.5px;color:var(--text-muted);margin-top:4px">press feedback</div></div><div style="background:var(--surface);border-radius:var(--radius-md);padding:12px;box-shadow:var(--shadow-xs)"><div class="cz-num" style="font-size:20px;font-weight:600">140ms</div><div class="mono" style="margin-top:2px">--dur-fast</div><div style="font-size:11.5px;color:var(--text-muted);margin-top:4px">hover, focus</div></div><div style="background:var(--surface);border-radius:var(--radius-md);padding:12px;box-shadow:var(--shadow-xs)"><div class="cz-num" style="font-size:20px;font-weight:600">200ms</div><div class="mono" style="margin-top:2px">--dur-base</div><div style="font-size:11.5px;color:var(--text-muted);margin-top:4px">menus, toggles</div></div><div style="background:var(--surface);border-radius:var(--radius-md);padding:12px;box-shadow:var(--shadow-xs)"><div class="cz-num" style="font-size:20px;font-weight:600">320ms</div><div class="mono" style="margin-top:2px">--dur-slow</div><div style="font-size:11.5px;color:var(--text-muted);margin-top:4px">toasts, bars</div></div></div>
<div class="mono" style="margin-top:12px">--ease-standard cubic-bezier(.2,0,0,1) · --ease-out cubic-bezier(.16,1,.3,1) — respeita prefers-reduced-motion</div></body></html>
