<!-- @dsCard group="Spacing" viewport="700x180" name="Layout constants" subtitle="Fixed widths every screen in the product shares" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans);color:var(--text-strong)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--text-muted)}.row{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid var(--border-hairline)}.row:last-child{border:none}</style></head><body><div style="display:flex;height:112px;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)">
<div style="width:124px;background:var(--cz-ink-900);color:var(--cz-lime-400);font-family:var(--font-mono);font-size:10px;padding:8px;display:flex;align-items:flex-end">248px<br>sidebar</div>
<div style="width:168px;background:var(--surface);border-right:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:10px;padding:8px;color:var(--text-muted);display:flex;align-items:flex-end">336px<br>inbox-list</div>
<div style="flex:1;background:var(--cz-paper-100);font-family:var(--font-mono);font-size:10px;padding:8px;color:var(--text-muted);display:flex;align-items:flex-end">conversa</div>
<div style="width:160px;background:var(--surface);border-left:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:10px;padding:8px;color:var(--text-muted);display:flex;align-items:flex-end">320px<br>context-panel</div>
</div>
<div class="mono" style="margin-top:10px">--topbar-h 60px · --page-gutter 24px · --content-max 1240px · --control-h 30 / 36 / 44px</div></body></html>
