<!-- @dsCard group="Brand" viewport="700x200" name="Symbol" subtitle="The four supplied lock-ups of the Conduzza mark — never redrawn, only placed" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.t{border-radius:var(--radius-card);overflow:hidden;box-shadow:var(--shadow-xs)}.t .p{height:112px;display:grid;place-items:center}.t img{width:60px;height:60px;object-fit:contain}.c{padding:8px 10px;background:var(--surface);font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint)}</style></head><body>
<div class="g">
<div class="t"><div class="p" style="background:var(--cz-ink-900)"><img src="../assets/symbol-lime-on-dark.png" alt="Símbolo lime sobre ink"></div><div class="c">symbol-lime-on-dark.png</div></div>
<div class="t"><div class="p" style="background:var(--cz-lime-400)"><img src="../assets/symbol-on-lime.png" alt="Símbolo ink sobre lime"></div><div class="c">symbol-on-lime.png</div></div>
<div class="t"><div class="p" style="background:var(--cz-cream-050)"><img src="../assets/symbol-on-cream.png" alt="Símbolo ink sobre cream"></div><div class="c">symbol-on-cream.png</div></div>
<div class="t"><div class="p" style="background:var(--surface);box-shadow:inset 0 0 0 1px var(--border-hairline)"><img src="../assets/symbol-lime.png" alt="Símbolo lime sobre branco"></div><div class="c">symbol-lime.png</div></div>
</div>
</body></html>
