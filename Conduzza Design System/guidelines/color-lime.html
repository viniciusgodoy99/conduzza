<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}.sw>div{flex:1;height:66px;display:flex;align-items:flex-end;padding:7px 8px;font-size:9.5px;font-weight:600;font-family:var(--font-mono)}.grid{display:grid;gap:10px}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--text-muted);margin-bottom:8px}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint)}</style></head><body><div class="lbl">Lime</div><div class="sw"><div style="background:var(--cz-lime-050);color:#051813">050</div><div style="background:var(--cz-lime-100);color:#051813">100</div><div style="background:var(--cz-lime-200);color:#051813">200</div><div style="background:var(--cz-lime-300);color:#051813">300</div><div style="background:var(--cz-lime-400);color:#051813">400</div><div style="background:var(--cz-lime-500);color:#051813">500</div><div style="background:var(--cz-lime-600);color:#fbfce8">600</div><div style="background:var(--cz-lime-700);color:#fbfce8">700</div><div style="background:var(--cz-lime-800);color:#fbfce8">800</div><div style="background:var(--cz-lime-900);color:#fbfce8">900</div></div>
<div style="margin-top:10px;display:flex;gap:16px;align-items:center"><span style="font-size:12px;color:var(--cz-lime-700);font-weight:600">Texto em lime-700 sobre branco ✓</span><span style="font-size:12px;background:var(--cz-lime-400);color:var(--cz-ink-900);padding:3px 9px;border-radius:999px;font-weight:600">Ink sobre lime-400 ✓</span></div></body></html>
