<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans);color:var(--text-strong)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--text-muted)}.row{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid var(--border-hairline)}.row:last-child{border:none}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
<div style="background:var(--surface);border-radius:var(--radius-card);padding:14px;box-shadow:var(--shadow-xs)"><div class="lbl">--font-sans / --font-display</div><div style="font-size:30px;font-weight:800;letter-spacing:-0.03em;margin-top:6px">Manrope</div><div style="font-size:13px;color:var(--text-muted)">400 · 500 · 600 · 700 · 800</div><div class="mono" style="margin-top:6px">Títulos, interface, corpo de texto</div></div>
<div style="background:var(--surface);border-radius:var(--radius-card);padding:14px;box-shadow:var(--shadow-xs)"><div class="lbl">--font-mono</div><div style="font-family:var(--font-mono);font-size:26px;font-weight:600;letter-spacing:-0.02em;margin-top:8px">JetBrains Mono</div><div class="mono" style="font-size:12px;color:var(--text-muted)">0123456789 · (11) 98812-4409</div><div class="mono" style="margin-top:6px">Números, horários, telefones, IDs</div></div>
</div></body></html>
