<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans);color:var(--text-strong)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--text-muted)}.row{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid var(--border-hairline)}.row:last-child{border:none}</style></head><body><div style="display:flex;gap:14px;flex-wrap:wrap"><div style="text-align:center"><div style="width:88px;height:62px;background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-xs)"></div><div class="mono" style="margin-top:8px">shadow-xs</div></div><div style="text-align:center"><div style="width:88px;height:62px;background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-sm)"></div><div class="mono" style="margin-top:8px">shadow-sm</div></div><div style="text-align:center"><div style="width:88px;height:62px;background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-md)"></div><div class="mono" style="margin-top:8px">shadow-md</div></div><div style="text-align:center"><div style="width:88px;height:62px;background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-lg)"></div><div class="mono" style="margin-top:8px">shadow-lg</div></div><div style="text-align:center"><div style="width:88px;height:62px;background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-pop)"></div><div class="mono" style="margin-top:8px">shadow-pop</div></div><div style="text-align:center"><div style="width:88px;height:62px;background:var(--cz-lime-400);border-radius:var(--radius-card);box-shadow:var(--shadow-accent)"></div><div class="mono" style="margin-top:8px">shadow-accent</div></div></div></body></html>
