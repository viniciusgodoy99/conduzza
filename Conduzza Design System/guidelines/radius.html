<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--canvas);font-family:var(--font-sans);color:var(--text-strong)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--text-muted)}.row{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid var(--border-hairline)}.row:last-child{border:none}</style></head><body><div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap"><div style="text-align:center"><div style="width:58px;height:58px;background:var(--surface);border:1px solid var(--border-subtle);border-radius:6px;box-shadow:var(--shadow-xs)"></div><div class="mono" style="margin-top:6px">6px</div><div class="mono" style="opacity:.6">xs</div></div><div style="text-align:center"><div style="width:58px;height:58px;background:var(--surface);border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-xs)"></div><div class="mono" style="margin-top:6px">8px</div><div class="mono" style="opacity:.6">sm</div></div><div style="text-align:center"><div style="width:58px;height:58px;background:var(--surface);border:1px solid var(--border-subtle);border-radius:10px;box-shadow:var(--shadow-xs)"></div><div class="mono" style="margin-top:6px">10px</div><div class="mono" style="opacity:.6">control</div></div><div style="text-align:center"><div style="width:58px;height:58px;background:var(--surface);border:1px solid var(--border-subtle);border-radius:12px;box-shadow:var(--shadow-xs)"></div><div class="mono" style="margin-top:6px">12px</div><div class="mono" style="opacity:.6">md</div></div><div style="text-align:center"><div style="width:58px;height:58px;background:var(--surface);border:1px solid var(--border-subtle);border-radius:16px;box-shadow:var(--shadow-xs)"></div><div class="mono" style="margin-top:6px">16px</div><div class="mono" style="opacity:.6">card</div></div><div style="text-align:center"><div style="width:58px;height:58px;background:var(--surface);border:1px solid var(--border-subtle);border-radius:18px;box-shadow:var(--shadow-xs)"></div><div class="mono" style="margin-top:6px">18px</div><div class="mono" style="opacity:.6">bubble</div></div><div style="text-align:center"><div style="width:58px;height:58px;background:var(--surface);border:1px solid var(--border-subtle);border-radius:20px;box-shadow:var(--shadow-xs)"></div><div class="mono" style="margin-top:6px">20px</div><div class="mono" style="opacity:.6">xl</div></div><div style="text-align:center"><div style="width:58px;height:58px;background:var(--surface);border:1px solid var(--border-subtle);border-radius:28px;box-shadow:var(--shadow-xs)"></div><div class="mono" style="margin-top:6px">28px</div><div class="mono" style="opacity:.6">2xl</div></div>
<div style="text-align:center"><div style="width:58px;height:28px;background:var(--cz-lime-400);border-radius:999px"></div><div class="mono" style="margin-top:6px">pill</div></div></div></body></html>
