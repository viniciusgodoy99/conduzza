<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { ChatBubble, ConversationItem, Composer, KanbanCard } = window.ConduzzaDesignSystem_cea3ac;
function Demo(){
  const [draft,setDraft]=React.useState('');
  return(<div style={{display:'grid',gridTemplateColumns:'260px 1fr 210px',gap:14,alignItems:'start'}}>
    <div style={{background:'var(--surface)',borderRadius:'var(--radius-card)',border:'1px solid var(--border-hairline)',overflow:'hidden'}}>

      <ConversationItem name="Tatiane Moraes" preview="Bom dia! Qual o valor?" time="ontem" tags={[{label:'Meta Ads',color:'#0866ff'}]}/>
      <ConversationItem name="Bruno Tavares" preview="Obrigado, até quinta." time="ontem"/>
    </div>
    <div style={{background:'var(--cz-paper-050)',borderRadius:'var(--radius-card)',border:'1px solid var(--border-hairline)',display:'flex',flexDirection:'column',overflow:'hidden'}}>

      <Composer value={draft} onChange={setDraft} aiSuggestion="Posso confirmar quinta às 10:30?" quickReplies={['Bom dia! 👋','Confirmar presença','Enviar endereço','Valores']}/>
    </div>
    <div style={{display:'grid',gap:10}}>
      <KanbanCard name="Tatiane Moraes" phone="(21) 98130-7755" meta="Interesse: Harmonização facial" tags={[{label:'Meta Ads',color:'#0866ff'}]} owner="Rafaela" value="R$ 1.200" waiting="2d 4h"/>

}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
